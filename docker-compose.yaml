services:
  app:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: always
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_PATH: /data/listpro.db
      # Almacén de precios de Mercadona: mad1 Madrid, bcn1 Barcelona, vlc1 Valencia, svq1 Sevilla…
      MERCADONA_WH: ${MERCADONA_WH:-mad1}
      # Hora (Madrid) de la actualización diaria de precios
      SCRAPE_HOUR: ${SCRAPE_HOUR:-6}
      # Para forzar una actualización con POST /api/admin/refresh
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # Planes de cenas con IA (la misma clave que Puchero/VoltBody)
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL_PLAN: ${GEMINI_MODEL_PLAN:-gemini-3-flash-preview}
      GEMINI_MODEL_FAST: ${GEMINI_MODEL_FAST:-gemini-3.5-flash-lite}
      # Firma de las sesiones de usuario. Opcional: si falta, se genera una y se guarda en la base de datos
      JWT_SECRET: ${JWT_SECRET:-}
      # Huella SHA-256 de la firma de release de la app Android (keytool -list -v): para que los enlaces
      # de invitación (/unirse/CODIGO) se abran directamente en la app. La de la build preview ya va incluida
      ANDROID_CERT_SHA256: ${ANDROID_CERT_SHA256:-}
    volumes:
      - listpro_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 384M

volumes:
  listpro_data:
